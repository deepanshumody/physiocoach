[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# PhysioCoach is built on NVIDIA's open-source live-vlm-webui (Apache-2.0):
#   https://github.com/nvidia-ai-iot/live-vlm-webui
# The PhysioCoach team added the physical-therapy layer on top of that base.
# The import package is still named `live_vlm_webui` (kept to preserve the
# upstream module paths and history); the distribution is `physiocoach`.
[project]
name = "physiocoach"
version = "0.1.0"
description = "Real-time AI physical-therapy coaching with local Vision Language Models and MediaPipe pose estimation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Deepanshu Mody"},
    {name = "Anagha Palandye"},
    {name = "Taruni Nugooru"},
]
keywords = [
    "physical-therapy",
    "rehabilitation",
    "pose-estimation",
    "mediapipe",
    "vlm",
    "vision-language-model",
    "ai-coaching",
    "real-time",
    "webrtc",
    "webcam",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = [
    "aiohttp>=3.9.5",
    "aiohttp-cors>=0.7.0",
    "aiortc>=1.9.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.4",
    "Pillow>=10.4.0",
    "openai>=1.54.3",
    "httpx>=0.27.2",
    "av>=12.3.0",
    "nvidia-ml-py>=11.5.0",
    "psutil>=5.9.8",
    "aiosqlite>=0.19.0",
    "mediapipe>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/deepanshumody/physiocoach"
Repository = "https://github.com/deepanshumody/physiocoach"
Issues = "https://github.com/deepanshumody/physiocoach/issues"
"Built on" = "https://github.com/nvidia-ai-iot/live-vlm-webui"

[project.scripts]
physiocoach = "live_vlm_webui.server:main"
physiocoach-stop = "live_vlm_webui.server:stop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
live_vlm_webui = ["static/*", "static/**/*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
