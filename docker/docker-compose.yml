# ==============================================================================
# PhysioCoach - local Docker stack (Ollama + PhysioCoach web server)
# ==============================================================================
# Builds the PhysioCoach image locally from docker/Dockerfile (it does NOT pull
# a prebuilt image) and runs it against a local Ollama serving Qwen2.5-VL-7B.
#
# Built on NVIDIA's live-vlm-webui (https://github.com/nvidia-ai-iot/live-vlm-webui).
#
# Quick start:
#   docker compose -f docker/docker-compose.yml up --build -d
#   docker exec physiocoach-ollama ollama pull qwen2.5vl:7b
#   # then open https://localhost:8090
#
# The `deploy.resources` GPU blocks below require the NVIDIA Container Toolkit.
# Remove them to run on CPU (the VLM will be slow without a GPU).
# ==============================================================================

services:
  ollama:
    image: ollama/ollama:latest
    container_name: physiocoach-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5

  physiocoach:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: physiocoach:latest
    container_name: physiocoach
    network_mode: host  # required for WebRTC
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      python -m live_vlm_webui.server
      --host 0.0.0.0
      --port 8090
      --ssl-cert cert.pem
      --ssl-key key.pem
      --api-base http://localhost:11434/v1
      --model qwen2.5vl:7b
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  ollama-data:
    driver: local
